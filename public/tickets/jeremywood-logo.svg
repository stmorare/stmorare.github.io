<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 375" width="100%" height="100%">
  <defs>
    <!-- Subtle Gradient for Watermark -->
    <linearGradient id="scriptWatermark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5BDB6" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#9C9289" stop-opacity="0.35" />
    </linearGradient>
  </defs>

  <!-- Clean Off-White / Ivory Background -->
  <rect width="1000" height="375" fill="#FAFAF9" rx="16" />

  <!-- Elegant Flourish / Calligraphic JW Watermark in Background -->
  <g transform="translate(500, 185) scale(1.4)" opacity="0.4">
    <!-- Calligraphic J flourish -->
    <path d="M -90,-80 C -60,-100 -20,-70 -35,-20 C -45,15 -60,60 -95,75 C -130,90 -160,50 -130,20 C -105,-5 -75,30 -60,65" fill="none" stroke="#A8A29E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Calligraphic W flourish -->
    <path d="M -40,-40 C -20,60 0,75 25,-30 C 40,65 60,75 90,-45 C 105,-80 135,-30 150,20" fill="none" stroke="#A8A29E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Centered Luxury Typography -->
  <g transform="translate(500, 180)">
    <!-- JEREMY WOOD -->
    <text x="0" y="0" text-anchor="middle" fill="#1C1917" font-family="'Didot', 'Bodoni MT', 'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="64" font-weight="700" letter-spacing="16">
      JEREMY WOOD
    </text>

    <!-- DESIGNED INTERIORS -->
    <text x="0" y="52" text-anchor="middle" fill="#44403C" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="19" font-weight="600" letter-spacing="18">
      DESIGNED INTERIORS
    </text>
  </g>
</svg>
