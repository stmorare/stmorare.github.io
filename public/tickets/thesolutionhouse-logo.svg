<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <!-- Clean Background -->
  <rect width="1000" height="380" fill="#FFFFFF" rx="16" />

  <g transform="translate(60, 55)">
    <!-- "THE" stack on the left with horizontal lines -->
    <g transform="translate(0, 40)">
      <line x1="0" y1="0" x2="45" y2="0" stroke="#0F172A" stroke-width="4" />
      <text x="22" y="28" text-anchor="middle" fill="#0F172A" font-family="'Arial Black', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="900">
        THE
      </text>
      <line x1="0" y1="36" x2="45" y2="36" stroke="#0F172A" stroke-width="4" />
    </g>

    <!-- "SOLUTION" in wide tracked cyan/teal display font -->
    <text x="65" y="68" fill="#5E9EA0" font-family="'Arial Black', 'Impact', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="82" font-weight="900" letter-spacing="18">
      SOLUTION
    </text>

    <!-- "HOUSE" with the iconic open door 'H' -->
    <g transform="translate(0, 100)">
      <!-- 'H' with open door integration -->
      <g transform="translate(65, 0)">
        <!-- Left vertical bar of H -->
        <rect x="0" y="20" width="22" height="135" fill="#0F172A" />
        <!-- Crossbar of H / door frame top -->
        <rect x="0" y="20" width="95" height="18" fill="#0F172A" />
        <!-- Right vertical bar of H -->
        <rect x="73" y="20" width="22" height="135" fill="#0F172A" />
        
        <!-- Open door perspective -->
        <path d="M 22,38 L 46,55 L 46,145 L 22,155 Z" fill="#0F172A" />
        <!-- Door knob -->
        <circle cx="40" cy="100" r="3.5" fill="#FFFFFF" />
      </g>

      <!-- Remaining letters: O U S E -->
      <text x="175" y="142" fill="#0F172A" font-family="'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="135" font-weight="900" letter-spacing="22">
        OUSE
      </text>
    </g>
  </g>
</svg>
