<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 375" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="1000" height="375" fill="#06090F" rx="16" />

  <!-- Centered Fusion 2K Branding Group -->
  <g transform="translate(110, 188)">
    <!-- Lime Green / Grey Stylized Geometric Icon -->
    <g transform="translate(0, -65)">
      <!-- Left Outer Green Wing -->
      <path d="M 45,0 L 70,0 L 25,65 L 70,130 L 45,130 L 0,65 Z" fill="#84CC16" />
      
      <!-- Middle Green Arrow / Line Segment -->
      <path d="M 68,28 L 88,28 L 62,65 L 88,102 L 68,102 L 42,65 Z" fill="#A3E635" />
      
      <!-- Right Dark Gray Wing -->
      <path d="M 90,0 L 115,0 L 135,65 L 115,130 L 90,130 L 110,65 Z" fill="#475569" />

      <!-- Inner Gray Details -->
      <path d="M 72,45 L 88,45 L 98,65 L 88,85 L 72,85 L 82,65 Z" fill="#334155" />
    </g>

    <!-- FUSION 2K Typography in Bold White & Accent Lime -->
    <text x="180" y="22" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="900" letter-spacing="12">
      FUSION <tspan fill="#84CC16">2K</tspan>
    </text>
  </g>
</svg>
