<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Green Gradient for PALM letters -->
    <linearGradient id="palmGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="50%" stop-color="#4D7C0F" />
      <stop offset="100%" stop-color="#365314" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- House Gradient -->
    <linearGradient id="houseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#3F6212" />
    </linearGradient>

    <!-- Gloss Highlight -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Clean Off-White / Light Grey Canvas -->
  <rect width="1000" height="400" fill="#FFFFFF" rx="16" />

  <!-- Logo Group -->
  <g transform="translate(140, 60)">
    <!-- Letter P -->
    <g transform="translate(0, 50)">
      <path d="M 0,0 L 50,0 C 75,0 95,20 95,45 C 95,70 75,90 50,90 L 26,90 L 26,160 L 0,160 Z" fill="url(#palmGreen)" stroke="#1E293B" stroke-width="5" stroke-linejoin="round" />
      <!-- P inner hole -->
      <path d="M 26,24 L 48,24 C 60,24 70,33 70,45 C 70,57 60,66 48,66 L 26,66 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="4" />
      <!-- P highlight -->
      <path d="M 6,6 L 46,6 C 68,6 84,22 84,45" fill="none" stroke="url(#gloss)" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Letter A (House with Sprout/Leaf) -->
    <g transform="translate(115, -10)">
      <!-- Leaf / Sprout on Roof -->
      <g transform="translate(130, 0)">
        <!-- Left Leaf -->
        <path d="M 0,60 C -15,40 -20,10 0,0 C 20,20 15,45 0,60 Z" fill="url(#leafGrad)" stroke="#166534" stroke-width="3" />
        <path d="M 0,60 Q -2,30 0,5" fill="none" stroke="#DCFCE7" stroke-width="2" />
        <!-- Right Small Leaf -->
        <path d="M 8,45 C 25,35 30,15 25,5 C 10,15 5,32 8,45 Z" fill="url(#leafGrad)" stroke="#166534" stroke-width="3" />
      </g>

      <!-- House Shape as 'A' -->
      <!-- Roof -->
      <path d="M 85,60 L 175,135 L 145,135 L 145,220 L 25,220 L 25,135 L -5,135 Z" fill="url(#houseGrad)" stroke="#1E293B" stroke-width="6" stroke-linejoin="round" />
      <!-- House inner door/arch (hole of A) -->
      <path d="M 60,220 L 60,170 C 60,155 72,145 85,145 C 98,145 110,155 110,170 L 110,220 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="5" />
      <!-- Roof highlight -->
      <path d="M 85,72 L 155,130" fill="none" stroke="url(#gloss)" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Letter L -->
    <g transform="translate(320, 50)">
      <path d="M 0,0 L 26,0 L 26,134 L 80,134 L 80,160 L 0,160 Z" fill="url(#palmGreen)" stroke="#1E293B" stroke-width="5" stroke-linejoin="round" />
      <!-- L highlight -->
      <path d="M 6,6 L 20,6 L 20,130 L 74,130" fill="none" stroke="url(#gloss)" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Letter M -->
    <g transform="translate(425, 50)">
      <path d="M 0,160 L 0,0 L 32,0 L 65,75 L 98,0 L 130,0 L 130,160 L 104,160 L 104,45 L 76,108 L 54,108 L 26,45 L 26,160 Z" fill="url(#palmGreen)" stroke="#1E293B" stroke-width="5" stroke-linejoin="round" />
      <!-- M highlight -->
      <path d="M 6,6 L 28,6 L 62,80" fill="none" stroke="url(#gloss)" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Subtitle: CENTRAL HEATING SPECIALISTS -->
    <text x="350" y="275" text-anchor="middle" fill="#0F172A" font-family="'Arial Black', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="9">
      CENTRAL HEATING SPECIALISTS
    </text>
  </g>
</svg>
