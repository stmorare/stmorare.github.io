<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <!-- Background Canvas -->
  <rect width="1000" height="450" fill="#0A0F1D" rx="16" />

  <!-- White Card Badge -->
  <g transform="translate(100, 50)">
    <rect width="800" height="350" rx="42" fill="#FFFFFF" stroke="#000000" stroke-width="16" />
    
    <!-- FLANNERY Main Logo Text -->
    <text x="400" y="195" text-anchor="middle" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Arial Black', 'Impact', sans-serif" font-size="108" font-weight="900" letter-spacing="6">
      FLANNERY
