    <!-- CIVIL ENGINEERING Subtitle Text -->
    <text x="400" y="270" text-anchor="middle" fill="#000000" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="18">
